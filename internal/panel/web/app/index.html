<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>steno</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>📝</text></svg>" />
    <script>
      // Класс темы ставится до первой отрисовки: иначе тёмная тема на секунду
      // показывает светлый экран, и это первое, что видит человек, открывший
      // панель ночью.
      //
      // Выбор человека главнее системы. Ключ и три его значения — те же, что у
      // src/lib/theme.ts; здесь их приходится повторить, потому что импортов у
      // этого скрипта нет, а выполниться он обязан раньше бандла. Слушателя
      // системной темы тут нет намеренно: дальше эту работу берёт на себя
      // theme.ts, и два независимых слушателя перетирали бы друг друга.
      (function () {
        var choice = "system";
        try {
          var saved = localStorage.getItem("ui:theme");
          if (saved === "light" || saved === "dark" || saved === "system") choice = saved;
        } catch (e) {}
        var dark =
          choice === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
            : choice === "dark";
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
