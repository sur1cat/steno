name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: internal/panel/web/app/package-lock.json }

      # Панель собирается первой: без бандла go:embed не находит файлов, и
      # сборка падает раньше тестов — с ошибкой, по которой не догадаться.
      - run: cd internal/panel/web/app && npm ci --no-audit --no-fund
      - run: cd internal/panel/web/app && npx tsc -b && npx vite build

      # Тесты гоняют настоящие адаптеры из adapters/ — это скрипты на bash,
      # которым нужны ffmpeg и jq, ровно как и в жизни. Подменять их
      # заглушками значило бы проверять не то, что запускается у людей.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq

      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test ./...
      # Разбор DOM площадок на синтетическом дереве: настоящий браузер не
      # поднимается, поэтому это можно гонять в CI.
      - run: make test-js
