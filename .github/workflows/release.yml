name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  # Для публикации образа бота в ghcr.io. Без этого docker/build-push-action
  # получит 403 на push — ровно как goreleaser без права на запись в тап.
  packages: write
jobs:
  # Образ бота: Chromium под Xvfb, PulseAudio и ffmpeg. Раньше его собирал у
  # себя каждый, кому нужен был бот, — то есть клонировал репозиторий и ждал
  # пять минут. Теперь он собирается один раз здесь и тянется по имени.
  bot-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/steno-bot
          # Тег совпадает с версией steno: обновив бинарник, легко было остаться
          # со вчерашним ботом и разбираться, почему он ведёт себя не так.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # amd64 и arm64: сервер обычно первый, ноутбук на Apple Silicon второй.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Мелкозернистый PAT с contents:write на sur1cat/homebrew-tap.
          # GITHUB_TOKEN заперт в этом репозитории и в тап запушить не может.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
