version: 2
project_name: steno

# Панель собирается до Go: бандл фронта попадает внутрь бинарника через
# go:embed, и без этого шага в релиз уехал бы бинарник с пустой панелью — ровно
# то, из-за чего `go install` и оказался нерабочим.
before:
  hooks:
    - go mod tidy
    - sh -c 'cd internal/panel/web/app && npm ci --no-audit --no-fund && npx vite build'

builds:
  - id: steno
    main: ./cmd/steno
    binary: steno
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/sur1cat/steno/internal/core.version={{.Version}}
    # Windows нет намеренно: бот запускается в контейнере Linux, а адаптеры
    # расшифровки — sh-скрипты. Обещать сборку, которой нечем пользоваться,
    # хуже, чем её не давать.
    goos:   [linux, darwin]
    goarch: [amd64, arm64]

# Адаптеры кладутся рядом с бинарником: расшифровка — внешняя команда, и без
# них steno умеет только субтитры площадки.
archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - adapters/**
      - README.md
      - README.ru.md
      - LICENSE

# Пакеты для тех, у кого нет brew: apt install ./steno_….deb и dnf install
# ставят бинарник, адаптеры и ffmpeg разом, а не «распакуй архив и разложи сам».
#
# Адаптеры уходят в /usr/share/steno/adapters. Это не выбор пакета, а то, где
# их ищет бинарник: FindAdapter в internal/core/confpath.go смотрит рядом с
# собой, затем в <bin>/../share/steno/adapters — с /usr/bin/steno это ровно
# /usr/share/steno/adapters, тот же путь, куда brew кладёт pkgshare. Не путь
# из конфига: у поставившего пакетом конфига ещё нет, а setup сам запишет
# найденное.
nfpms:
  - id: packages
    ids: [steno]
    package_name: steno
    vendor: Rustem Turgeldin
    homepage: https://github.com/sur1cat/steno
    maintainer: Rustem Turgeldin <rustem.turgeldin@bk.ru>
    description: "Meeting notes and follow-ups: a bot joins your calls, records, transcribes, publishes"
    license: MIT
    section: utils
    # apk нет: адаптеры — bash-скрипты, а в Alpine bash не из коробки.
    formats: [deb, rpm]
    # Имена как у самих дистрибутивов — steno_0.3.1_amd64.deb и
    # steno-0.3.1-1.x86_64.rpm, — а не общий шаблон goreleaser с linux в имени:
    # их и ждёт человек, набирающий apt install ./steno_… по памяти.
    file_name_template: "{{ .ConventionalFileName }}"
    bindir: /usr/bin
    dependencies:
      - ffmpeg
    # То же, что depends_on => :recommended у brew: whisper и jq ставятся по
    # умолчанию, но пакет без них не ломается — кто распознаёт в облаке, ставит
    # с --no-install-recommends и ничего не тянет. Имена — как в самих
    # дистрибутивах: в Debian whisper.cpp — метапакет, тянущий whisper.cpp-tools
    # с бинарником; в Fedora — whisper-cpp.
    recommends:
      - whisper.cpp
      - jq
    overrides:
      rpm:
        # В Fedora из коробки ffmpeg-free, а пакет с именем ffmpeg — только из
        # RPM Fusion. Оба ставят /usr/bin/ffmpeg, и зависимость от файла
        # принимает любой; по имени пакет не встал бы на чистую Fedora.
        dependencies:
          - /usr/bin/ffmpeg
        recommends:
          - whisper-cpp
          - jq
    contents:
      - src: adapters
        dst: /usr/share/steno/adapters
        type: tree
      - src: LICENSE
        dst: /usr/share/doc/steno/copyright

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  draft: false
  prerelease: auto

# Формула, а не cask, и это выяснено опытом.
#
# goreleaser объявил brews устаревшим в пользу homebrew_casks, и первый релиз
# так и был сделан. Установка получилась нерабочей: cask вешает на скачанный
# бинарник com.apple.quarantine, а снять его должен постустановочный блок,
# который goreleaser умеет писать только устаревшим ключом postflight — и
# Homebrew этот ключ больше не выполняет, только предупреждает о нём. В итоге
# `brew install` ставил бинарник, который macOS убивает сигналом на запуске.
# Проверено: xattr -dr com.apple.quarantine чинит, значит причина именно в нём.
#
# Формула этой болезни лишена: она распаковывает архив сама и карантин не вешает.
# Ключ brews помечен устаревшим, но работает; вернуться к cask будет можно, когда
# goreleaser научится писать postflight_steps.
brews:
  - name: steno
    repository:
      owner: sur1cat
      name: homebrew-tap
      branch: main
      # Токен с правом записи в репозиторий тапа. Обычный GITHUB_TOKEN заперт
      # в этом репозитории и в чужой запушить не может.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/sur1cat/steno"
    description: "Meeting notes and follow-ups: a bot joins your calls, records, transcribes, publishes"
    license: MIT
    commit_author:
      name: goreleaser
      email: noreply@github.com
    commit_msg_template: "steno {{ .Tag }}"
    # ffmpeg нужен всегда — им пишется звук и готовится аудио. whisper-cpp и jq
    # ставятся по умолчанию, но не обязательны (recommended): с ними `steno
    # note` работает сразу после установки, а кто распознаёт в Groq или
    # AssemblyAI, ставит с --without-whisper-cpp --without-jq и ничего не
    # тянет. goreleaser печатает это как depends_on "whisper-cpp" => :recommended.
    dependencies:
      - name: ffmpeg
      - name: whisper-cpp
        type: recommended
      - name: jq
        type: recommended
    # Адаптеры расшифровки кладутся рядом с бинарником: без них steno умеет
    # только субтитры площадки, а setup ищет их именно в share пакета. Первая
    # brew-установка этого не делала, и распознавание оказывалось неработающим.
    extra_install: |
      pkgshare.install "adapters"
    test: |
      assert_match "steno", shell_output("#{bin}/steno help")
      assert_predicate pkgshare/"adapters/whisper-cpp.sh", :exist?
    caveats: |
      Настройка одной командой — она спросит всё нужное и проверит по ходу:

        steno setup

      Боту нужен Docker: контейнер с Chromium и звуком steno скачает сам перед
      первым созвоном. Заранее — docker pull ghcr.io/sur1cat/steno-bot

      Наговорить заметку, ничего не настраивая (модель скачается по одному Enter):

        steno note

      whisper-cpp и jq поставлены как recommended: кто распознаёт в облаке
      (Groq, AssemblyAI), может их не ставить — brew install steno
      --without-whisper-cpp --without-jq — или убрать потом.
