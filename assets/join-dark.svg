oe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#DCE8E2">everyone left; the bot leaves too and closes the file</text></g><g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" keyTimes="0.00000;0.85833;0.87778;0.98333;1.00000" values="0;0;1;1;0"/><circle cx="46" cy="420" r="4" fill="#6BCB9B"/><text x="60" y="424" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#DCE8E2">two files become one transcript</text></g></svg>