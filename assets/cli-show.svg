<svg xmlns="http://www.w3.org/2000/svg" width="1054" height="625" viewBox="0 0 1054 625"><rect width="1054" height="625" rx="12" fill="#0B0F0D"/><rect width="1054" height="34" rx="12" fill="#131C17"/><circle cx="24" cy="17" r="5.5" fill="#3A4A42"/><circle cx="42" cy="17" r="5.5" fill="#3A4A42"/><circle cx="60" cy="17" r="5.5" fill="#3A4A42"/><text x="527.0" y="22" text-anchor="middle" font-family="SF Mono,Menlo,monospace" font-size="12" fill="#5C6B63">steno show</text><g font-family="SF Mono,Menlo,DejaVu Sans Mono,monospace" font-size="14"><text x="20.0" y="63.5" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">$ steno show 2026-09-09-1100-a1b2                                                                                     </text><text x="20.0" y="82.0" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">Release 2.4 moves to Friday because the migration will not make it                                                    </text><text x="20.0" y="100.5" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">10 Sep 2026, 09:21 · Ana Ribeiro, Marek Nowak, Priya Nair, Tom Ellis                                                  </text><text x="20.0" y="137.5" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">  The release moves from Wednesday to Friday: the schema migration will not get through staging in time.              </text><text x="20.0" y="156.0" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">  Agreed not to cut features but to move the date — rolling the migration back costs more than a week of waiting.     </text><text x="20.0" y="174.5" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">  Left open: who is on call over the weekend after the rollout.                                                       </text><text x="20.0" y="211.5" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">Tasks                                                                                                                 </text><text x="20.0" y="230.0" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">  [00:06:52] Marek Nowak — finish the schema migration and run it against staging (2026-09-11)                        </text><text x="20.0" y="248.5" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">  [00:18:25] Priya Nair — update the changelog and the customer email for the new date (2026-09-10)                   </text><text x="20.0" y="267.0" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">  [00:31:30] unassigned — decide who is on call over the weekend after the rollout (no due date)                      </text><text x="20.0" y="285.5" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">  [00:12:40] Tom Ellis — check that the migration rollback works on a copy of the production database (2026-09-04)    </text><text x="20.0" y="322.5" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">Decisions                                                                                                             </text><text x="20.0" y="341.0" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">  [00:06:20] release on Friday, 11 September — the migration cannot land sooner, and cutting features costs more      </text><text x="20.0" y="359.5" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">  [00:10:40] no features get cut — half of them are already in beta with three customers                              </text><text x="20.0" y="396.5" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">Open questions                                                                                                        </text><text x="20.0" y="415.0" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">  [00:31:30] who is on call over the weekend after the rollout (waiting on: Ana Ribeiro)                              </text><text x="20.0" y="433.5" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">  [00:36:50] does the migration need a separate load test after it (waiting on: not decided)                          </text><text x="20.0" y="470.5" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">Risks                                                                                                                 </text><text x="20.0" y="489.0" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">  If the migration does not pass staging on Friday morning, the release slips a week.                                 </text><text x="20.0" y="507.5" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">  The migration rollback has never been tested at production data volume.                                             </text><text x="20.0" y="563.0" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">google_docs  https://docs.google.com/document/d/1abc/edit                                                             </text><text x="20.0" y="581.5" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">slack        https://team.slack.com/archives/C01/p1757                                                                </text><text x="20.0" y="600.0" fill="#D6E3DC" textLength="1014.8" lengthAdjust="spacing" xml:space="preserve">telegram                                                                                                              </text></g></svg>