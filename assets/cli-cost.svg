<svg xmlns="http://www.w3.org/2000/svg" width="934" height="218" viewBox="0 0 934 218"><rect width="934" height="218" rx="12" fill="#0B0F0D"/><rect width="934" height="34" rx="12" fill="#131C17"/><circle cx="24" cy="17" r="5.5" fill="#3A4A42"/><circle cx="42" cy="17" r="5.5" fill="#3A4A42"/><circle cx="60" cy="17" r="5.5" fill="#3A4A42"/><text x="467.0" y="22" text-anchor="middle" font-family="SF Mono,Menlo,monospace" font-size="12" fill="#5C6B63">steno cost 30</text><g font-family="SF Mono,Menlo,DejaVu Sans Mono,monospace" font-size="14"><text x="20.0" y="63.5" fill="#D6E3DC" textLength="894.4" lengthAdjust="spacing" xml:space="preserve">$ steno cost 30                                                                                         </text><text x="20.0" y="82.0" fill="#D6E3DC" textLength="894.4" lengthAdjust="spacing" xml:space="preserve">over 30 days: 3 follow-ups, $0.27                                                                       </text><text x="20.0" y="100.5" fill="#D6E3DC" textLength="894.4" lengthAdjust="spacing" xml:space="preserve">  tokens: 5774 in, 8057 out                                                                             </text><text x="20.0" y="119.0" fill="#D6E3DC" textLength="894.4" lengthAdjust="spacing" xml:space="preserve">  on average: $0.091 per meeting                                                                        </text><text x="20.0" y="156.0" fill="#D6E3DC" textLength="894.4" lengthAdjust="spacing" xml:space="preserve">Output costs five times what input does, and at effort=low most of it is                                </text><text x="20.0" y="174.5" fill="#D6E3DC" textLength="894.4" lengthAdjust="spacing" xml:space="preserve">the model thinking, not the follow-up itself. There is nothing lower left —                             </text><text x="20.0" y="193.0" fill="#D6E3DC" textLength="894.4" lengthAdjust="spacing" xml:space="preserve">from here on, only a cheaper model in claude.model.                                                     </text></g></svg>