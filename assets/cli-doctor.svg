<svg xmlns="http://www.w3.org/2000/svg" width="1209" height="532" viewBox="0 0 1209 532"><rect width="1209" height="532" rx="12" fill="#0B0F0D"/><rect width="1209" height="34" rx="12" fill="#131C17"/><circle cx="24" cy="17" r="5.5" fill="#3A4A42"/><circle cx="42" cy="17" r="5.5" fill="#3A4A42"/><circle cx="60" cy="17" r="5.5" fill="#3A4A42"/><text x="604.5" y="22" text-anchor="middle" font-family="SF Mono,Menlo,monospace" font-size="12" fill="#5C6B63">steno doctor</text><g font-family="SF Mono,Menlo,DejaVu Sans Mono,monospace" font-size="14"><text x="20.0" y="63.5" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">$ steno doctor                                                                                                                          </text><text x="20.0" y="82.0" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">steno doctor · config steno.json                                                                                                        </text><text x="20.0" y="119.0" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">  ✓ data             data                                                                                                               </text><text x="20.0" y="137.5" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">  ✓ bot (docker)     image ghcr.io/sur1cat/steno-bot:v0.3.0 is missing — it will be pulled before the first meeting                     </text><text x="20.0" y="156.0" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">      → you can do it ahead of time:  docker pull ghcr.io/sur1cat/steno-bot:v0.3.0                                                      </text><text x="20.0" y="174.5" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">  ✓ platforms        supported: Google Meet, Jitsi Meet                                                                                 </text><text x="20.0" y="193.0" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">      → Jitsi Meet does not always have captions: on the public meet.jit.si they are turned off on the server (transcription.enabled=fal</text><text x="20.0" y="211.5" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">se)                                                                                                                                     </text><text x="20.0" y="230.0" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">      → without them the transcript comes from the audio and has no speaker names; what actually happened is in the bot&#x27;s “captions: …” </text><text x="20.0" y="248.5" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">line and in the captions field of result.json                                                                                           </text><text x="20.0" y="267.0" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">      → your own Jitsi server is added to selectors.json, under the jitsi.hosts key                                                     </text><text x="20.0" y="285.5" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">  ✓ transcript       the adapter ran, model ggml-large-v3-q5_0.bin                                                                      </text><text x="20.0" y="304.0" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">  ✓ Claude           claude-opus-5, effort low · subscription through claude -p (claude.ai)                                             </text><text x="20.0" y="322.5" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">  — Google           not connected, and nobody needs it                                                                                 </text><text x="20.0" y="341.0" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">  — calendar         off                                                                                                                </text><text x="20.0" y="359.5" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">  — bot mailbox      off                                                                                                                </text><text x="20.0" y="378.0" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">  ✓ Telegram in      TELEGRAM_BOT_TOKEN is set                                                                                          </text><text x="20.0" y="396.5" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">  — HTTP in          off                                                                                                                </text><text x="20.0" y="415.0" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">  — Google Docs      off                                                                                                                </text><text x="20.0" y="433.5" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">  — Slack            off                                                                                                                </text><text x="20.0" y="452.0" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">  ✓ Telegram         TELEGRAM_BOT_TOKEN is set                                                                                          </text><text x="20.0" y="470.5" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">  ✓ panel            listening on 127.0.0.1:8331                                                                                        </text><text x="20.0" y="507.5" fill="#D6E3DC" textLength="1169.6" lengthAdjust="spacing" xml:space="preserve">Everything is ready.                                                                                                                    </text></g></svg>